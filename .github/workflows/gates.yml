# The same five gates CONTRIBUTING.md asks a contributor to run, plus a
# nondeploying Worker bundle/config validation, on every push and pull request.
# Kept as one job on purpose: they share an install and a build, and splitting
# the short run would cost more setup than it saves in parallelism.
name: gates

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    # The whole run takes well under a minute. The cap is here because
    # test:d1 spawns workerd, and a wedged one would otherwise sit for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No version pinned: this project tracks bun closely, and a pin left to
      # rot is worse than a gate that tells you bun moved.
      - uses: oven-sh/setup-bun@v2

      # --frozen-lockfile: CI must fail on a lockfile that disagrees with
      # package.json rather than quietly resolving something else.
      - run: bun install --frozen-lockfile

      - run: bun run lint

      # tsc -b --force, deliberately: see CONTRIBUTING.md.
      - run: bun run typecheck

      - run: bun test

      # The storage contract against a real workerd D1 binding. It verifies API
      # shapes, batch behaviour, and migrations; fake-D1 owns the service-only
      # 100-bound-parameter regression because local workerd does not enforce it.
      - run: bun run test:d1

      - run: bun run build

      # Bundle the Worker and validate its config/assets without deploying.
      - run: bunx wrangler deploy --dry-run
